<script src="/assets/orion.js?v=rain1"></script>
<script>
function addNotice(text){
  const panel = document.querySelector(".panel");
  const div = document.createElement("div");
  div.className = "line";
  div.textContent = text;
  panel.appendChild(div);
}
let id = localStorage.getItem("obsid") || "OBS-" + Math.random().toString(16).slice(2,6).toUpperCase() + "-" + Math.floor(Math.random()*900+100);
localStorage.setItem("obsid", id);
document.getElementById("obs").textContent = id;
setTimeout(()=>{
  localStorage.setItem("observer_discovered","true");
  document.getElementById("pending").textContent = "KEY RECOGNIZED: OBSERVER";
}, 8000);
</script>
