<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RABBIT // ORION DEEP FILE</title>
<link rel="stylesheet" href="/assets/orion.css?v=progress1">
<style>
.deep-file{position:relative;overflow:hidden}
.deep-file:before{
  content:"";
  position:absolute;
  inset:-40%;
  background:radial-gradient(circle at 30% 35%,rgba(255,255,255,.13),transparent 18%),radial-gradient(circle at 70% 55%,rgba(255,0,0,.22),transparent 20%),repeating-linear-gradient(90deg,rgba(255,0,0,.08),rgba(255,0,0,.08) 2px,transparent 3px,transparent 9px);
  filter:invert(1) contrast(1.8) saturate(0);
  opacity:.18;
  animation:drift 12s linear infinite;
  pointer-events:none
}
@keyframes drift{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(-4%,2%) rotate(2deg)}100%{transform:translate(0,0) rotate(0deg)}}
.visual{
  margin:18px auto;
  width:min(720px,100%);
  aspect-ratio:16/9;
  border:1px solid #750000;
  background:#050000;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 34px rgba(255,0,0,.32),inset 0 0 54px rgba(255,0,0,.14);
  filter:invert(.92) hue-rotate(165deg) contrast(1.45) saturate(.55);
}
.visual:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14),rgba(0,0,0,.14) 1px,transparent 2px,transparent 5px),radial-gradient(circle at 50% 50%,transparent 0 35%,rgba(255,255,255,.30) 70%);
  mix-blend-mode:multiply;
  animation:staticFlash .16s steps(2) infinite
}
.visual:after{
  content:"DEPTH UNKNOWN";
  position:absolute;
  left:18px;
  bottom:14px;
  z-index:6;
  color:#000;
  font-size:12px;
  letter-spacing:3px;
  text-shadow:0 0 8px #fff;
  opacity:.82
}
@keyframes staticFlash{0%,100%{opacity:.22;transform:translateX(0)}50%{opacity:.72;transform:translateX(3px)}}
.visual svg{width:100%;height:100%;display:block}
.line{position:relative;z-index:2}
.deep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.deep-card{border:1px dashed #730000;background:rgba(0,0,0,.75);padding:12px;min-height:90px}
.warning-pulse{animation:pulseWarn 1.4s infinite steps(2)}
@keyframes pulseWarn{50%{color:white;text-shadow:0 0 18px #fff,0 0 30px #f00}}
.swarm span{position:absolute;color:#ff2020;font-size:32px;text-shadow:0 0 15px #f00;animation:swarm 6s infinite linear;z-index:8}
.swarm span:nth-child(1){left:8%;top:10%;animation-delay:.1s}
.swarm span:nth-child(2){left:22%;top:50%;animation-delay:.6s}
.swarm span:nth-child(3){left:36%;top:22%;animation-delay:1.1s}
.swarm span:nth-child(4){left:48%;top:72%;animation-delay:1.7s}
.swarm span:nth-child(5){left:63%;top:35%;animation-delay:2.3s}
.swarm span:nth-child(6){left:75%;top:12%;animation-delay:2.9s}
.swarm span:nth-child(7){left:83%;top:64%;animation-delay:3.5s}
.swarm span:nth-child(8){left:12%;top:76%;animation-delay:4.1s}
.swarm span:nth-child(9){left:55%;top:8%;animation-delay:4.7s}
.swarm span:nth-child(10){left:68%;top:82%;animation-delay:5.3s}
@keyframes swarm{0%{transform:translate(0,0) rotate(0deg);opacity:.2}50%{transform:translate(26px,-18px) rotate(180deg);opacity:1}100%{transform:translate(-12px,20px) rotate(360deg);opacity:.2}}
.doc-visual{display:grid;place-items:center;padding:28px}
.file-photo{width:72%;height:78%;border:2px solid #111;background:#eee;color:#000;padding:24px;position:relative;transform:rotate(-1.3deg);box-shadow:0 0 25px #fff}
.stamp{position:absolute;right:30px;top:32px;z-index:10;border:4px solid #000;color:#000;font-weight:900;font-size:24px;transform:rotate(12deg);padding:8px;opacity:.65}
.doc-line{height:12px;background:#222;margin:15px 0;width:62%}
.doc-line.wide{width:90%}
.doc-line.short{width:42%}
.redact{height:22px;background:#000;width:78%;margin:20px 0}
.small-redact{width:45%}
.hole{position:absolute;right:28px;top:28px;width:54px;height:54px;border-radius:50%;border:5px solid #000}
.void-visual{display:grid;place-items:center;filter:invert(.88) contrast(2) saturate(.5)}
.void-core{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 0 45px #fff,0 0 120px #f00;animation:voidPulse 3s infinite}
.void-ring{position:absolute;border-radius:50%;border:2px solid #fff;animation:expand 4s infinite linear}
.r1{width:160px;height:160px}.r2{width:250px;height:250px;animation-delay:1s}.r3{width:340px;height:340px;animation-delay:2s}
.void-text{position:absolute;bottom:28px;color:#fff;letter-spacing:4px;text-shadow:0 0 16px #fff}
@keyframes voidPulse{50%{transform:scale(1.18)}}
@keyframes expand{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
</style>
</head>

</div>
    <div class="line">THE RABBIT NEVER MOVED.</div><div class="line">YOU DID.</div><div class="line">DEPTH CANNOT BE MEASURED FROM INSIDE THE FALL.</div>

</div>
