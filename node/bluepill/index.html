<style>
.deep-file {
  position:relative;
  overflow:hidden;
}
.deep-file:before {
  content:"";
  position:absolute;
  inset:-40%;
  background:
    radial-gradient(circle at 30% 35%, rgba(255,255,255,.12), transparent 18%),
    radial-gradient(circle at 70% 55%, rgba(255,0,0,.20), transparent 20%),
    repeating-linear-gradient(90deg, rgba(255,0,0,.08), rgba(255,0,0,.08) 2px, transparent 3px, transparent 9px);
  filter:invert(1) contrast(1.8) saturate(0);
  opacity:.20;
  animation: drift 12s linear infinite;
  pointer-events:none;
}
@keyframes drift {
  0%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(-4%,2%) rotate(2deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}
.image-frame {
  margin:18px auto;
  width:min(640px,100%);
  aspect-ratio:16/9;
  border:1px solid #750000;
  background:#050000;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 32px rgba(255,0,0,.30), inset 0 0 50px rgba(255,0,0,.12);
  filter:invert(.92) hue-rotate(165deg) contrast(1.45) saturate(.55);
}
.image-frame svg {
  width:100%;
  height:100%;
  display:block;
}
.image-frame:before {
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.12), rgba(0,0,0,.12) 1px, transparent 2px, transparent 5px),
    radial-gradient(circle at 50% 50%, transparent 0 35%, rgba(255,255,255,.30) 70%);
  mix-blend-mode:multiply;
  animation: staticFlash .18s steps(2) infinite;
}
.image-frame:after {
  content:"STABLE/CAGE";
  position:absolute;
  left:18px;
  bottom:14px;
  color:#000;
  font-size:12px;
  letter-spacing:3px;
  text-shadow:0 0 8px #fff;
  opacity:.8;
}
@keyframes staticFlash {
  0%,100%{opacity:.25;transform:translateX(0)}
  50%{opacity:.68;transform:translateX(3px)}
}
.redacted {
  display:inline-block;
  background:#ff2020;
  color:#000;
  padding:0 8px;
  filter:invert(1);
}
.deep-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}
.deep-card {
  border:1px dashed #730000;
  background:rgba(0,0,0,.75);
  padding:12px;
  min-height:90px;
}
.warning-pulse {
  animation: pulseWarn 1.4s infinite steps(2);
}
@keyframes pulseWarn {
  50%{color:white;text-shadow:0 0 18px #fff,0 0 30px #f00}
}
</style>
</head>
