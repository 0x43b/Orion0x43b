<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECHO // ORION</title>
<link rel="stylesheet" href="/assets/orion.css?v=progress1">
<style>
.final-wrap{
  min-height:100vh;
  display:grid;
  place-items:center;
  text-align:center;
}
.final-panel{
  width:min(900px,94vw);
  border:1px solid #650000;
  background:rgba(0,0,0,.82);
  padding:28px;
  box-shadow:0 0 42px rgba(255,0,0,.28), inset 0 0 36px rgba(255,0,0,.08);
}
.final-eye{
  font-size:clamp(72px,18vw,180px);
  color:#ff2020;
  text-shadow:0 0 30px #f00,0 0 80px #900;
  animation:pulseFinal 5s infinite ease-in-out;
}
@keyframes pulseFinal{
  0%,100%{opacity:.55;transform:scale(.96)}
  50%{opacity:1;transform:scale(1.05)}
}
.final-line{
  margin:18px 0;
  color:#ffb6b6;
  font-family:Consolas,monospace;
  letter-spacing:2px;
}
.final-red{
  color:#ff2020;
  text-shadow:0 0 16px #f00;
}
</style>
</head>
<body>
<div class="final-wrap">
  <div class="final-panel">
    <div class="final-eye">◉</div>
    <h1 class="glitch">ECHO RECOVERED</h1>
    <div class="final-line">You found the wound.</div>
    <div class="final-line">You did not repair reality.</div>
    <div class="final-line final-red">You returned ORION to itself.</div>
    <div class="final-line">Observer: <b id="obs">UNKNOWN</b></div>
    <div class="final-line">NODE 0x43B STATUS: ACTIVE</div>
    <div class="final-line">REALITY STATUS: DAMAGED</div>
    <a href="/node/">RETURN TO NODE</a>
  </div>
</div>

<!-- FINAL SOURCE:
     The ARG does not end.
     It echoes.
     Future relay command: support
-->

<script src="/assets/orion.js?v=progress1"></script>
<script>
const id = localStorage.getItem("obsid") || "UNKNOWN";
document.getElementById("obs").textContent = id;

try{
  const saved = JSON.parse(localStorage.getItem("orion0x43b_arg_v2") || "{}");
  if(!saved.flags || !saved.flags.argComplete){
    document.querySelector(".final-red").textContent = "This echo is premature.";
  }
}catch(e){}
</script>
</body>
</html>
