<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GATE</title>
<link rel="stylesheet" href="/assets/orion.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">ORION</div>
      <div class="sub">NODE 0x43B // GATE</div>
    </div>
    <div class="time" data-time>SYNCING</div>
  </div>
  <div class="panel">
    <div class="eye">
      <svg viewBox="0 0 300 170">
        <path d="M20 85 Q150 12 280 85 Q150 158 20 85Z" fill="none" stroke="rgba(255,35,35,.95)" stroke-width="3"/>
        <ellipse cx="150" cy="85" rx="104" ry="42" fill="none" stroke="rgba(255,0,0,.38)" stroke-width="2"/>
        <circle cx="150" cy="85" r="33" fill="none" stroke="rgba(255,80,80,.95)" stroke-width="4"/>
        <circle cx="150" cy="85" r="9" fill="rgba(255,0,0,.98)"/>
        <text x="150" y="164" text-anchor="middle" fill="rgba(255,60,60,.74)" font-size="9" font-family="monospace">REALITY IS THE DAMAGED SYSTEM</text>
      </svg>
    </div>
    <h1 class="glitch">THE GATE NOTICES YOU</h1>
<div class="big">◉</div>
<div class="line">It does not open.</div>
<div class="line">It recognizes damage.</div>
<div class="line" id="pending">Recognition pending...</div>
<!-- CLUE: origin -->
    <a href="/node/">RETURN TO NODE</a>
  </div>
</div>
<script src="/assets/orion.js"></script>
<script>
function addNotice(text){
  const panel = document.querySelector(".panel");
  const div = document.createElement("div");
  div.className = "line";
  div.textContent = text;
  panel.appendChild(div);
}
setTimeout(()=>{
  localStorage.setItem("gate_discovered","true");
  document.getElementById("pending").textContent = "KEY RECOGNIZED: GATE";
}, 15000);
</script>
</body>
</html>
